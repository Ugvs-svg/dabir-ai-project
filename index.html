<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DabirAI Interface</title>
    
    <style>
        /* --- STYLES: All CSS embedded here --- */
        html, body { margin:0; padding:0; height:100%; font-family:Arial,sans-serif; overflow:hidden; }
        #dabir-root {
            position:fixed; inset:0; display:flex; z-index:999999; color:#fff;
            background: linear-gradient(270deg, #ff0000, #000000, #ff0000, #000000);
            background-size: 800% 800%;
            animation: animatedBG 15s linear infinite;
        }
        @keyframes animatedBG { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }

        /* Sidebar */
        #dabir-sidebar { width:200px; background: linear-gradient(45deg,#ff0000,#000000); display:flex; flex-direction:column; padding:16px; border-right:1px solid #444; box-sizing:border-box; }
        #dabir-logo { width:35px; height:35px; margin:0 auto 20px; background: linear-gradient(45deg,#ff0000,#000000); border-radius:10px; }
        #dabir-login span { display:block; background:#220000; padding:10px; border-radius:10px; cursor:pointer; text-align:center; margin-bottom:20px; }

        .dabir-btn { padding:10px; margin-bottom:10px; background:#ff0000; border:none; border-radius:10px; color:#fff; font-weight:bold; cursor:pointer; text-align:left; }

        /* Main Chat Area */
        #dabir-main { flex:1; display:flex; flex-direction:column; backdrop-filter:blur(2px); background: linear-gradient(45deg,#000000,#ff0000); }
        #dabir-header { padding:16px; background: linear-gradient(45deg,#ff0000,#000000); font-weight:bold; font-size:20px; border-bottom:1px solid #444; display:flex; justify-content:space-between; align-items:center; }
        #dabir-messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
        .bubble { max-width:70%; padding:14px 18px; border-radius:20px; line-height:1.4; white-space:pre-wrap; color:#fff; }
        .user { background:#ff4c4c; align-self:flex-end; }
        .ai { background:rgba(60,0,0,0.85); align-self:flex-start; }
        #dabir-input-area { display:flex; padding:12px 16px; gap:10px; border-top:1px solid #444; background:linear-gradient(45deg,#000000,#ff0000); }
        #dabir-input { flex:1; border-radius:15px; padding:12px; border:none; outline:none; background:#220000; color:#fff; font-size:14px; resize:none; }
        #dabir-send { padding:12px 20px; border:none; border-radius:15px; background:#ff0000; color:#fff; font-weight:bold; cursor:pointer; }
        #dabir-block-msg { flex:1; display:flex; justify-content:center; align-items:center; font-size:24px; text-align:center; padding:20px; }
        .vibe-img { max-width:60%; border-radius:15px; align-self:flex-start; }

        @keyframes vibeBG { 0% {background-position:0% 50%;} 50% {background-position:100% 50%;} 100% {background-position:0% 50%;} background-size: 400% 400%; }

        /* DabirOS modal styles */
        .dabir-backdrop { position: fixed; inset:0; background: rgba(0,0,0,0.6); z-index: 2147483647; display:flex; align-items:center; justify-content:center; font-family: Arial, Helvetica, sans-serif; }
        .dabir-modal, .dabir-form { border-radius:12px; overflow:hidden; box-shadow:0 8px 40px rgba(0,0,0,0.6); background: linear-gradient(180deg,#110000,#220000); color:#fff; border:1px solid rgba(255,80,80,0.08); padding:16px; }
        .dabir-modal .dabir-actions, .dabir-form button { display:inline-block; margin-top:12px; }
        .dabir-yes { background:#ff1f1f; color:#fff; padding:8px 12px; border-radius:10px; cursor:pointer; font-weight:700; }
        .dabir-no { background:#222; color:#ff8b8b; border:1px solid rgba(255,140,140,0.08); padding:8px 12px; border-radius:10px; cursor:pointer; font-weight:700; }
        .dabir-form h2 { margin-top:0; }
        .dabir-image { width:320px; max-width:100%; border-radius:10px; background: linear-gradient(45deg,#220000,#000000); margin-top:12px; }
        .dabir-note { font-size:13px; margin-top:8px; color:#ffdede; }
        @media (max-width:720px){ .dabir-image { width:100%; } }
    </style>
</head>
<body>

    <div id="dabir-root">
        <div id="dabir-sidebar">
            <div id="dabir-logo"></div>
            <div id="dabir-login"><span id="dabir-google">Login with Google</span></div>
            <button class="dabir-btn" id="dabir-newchat">New Chat</button>
            <button class="dabir-btn" id="dabir-vibes">Vibes</button>
            <button class="dabir-btn" id="dabir-create">Create</button>
        </div>
        <div id="dabir-main">
            <div id="dabir-header">DabirAI (Made By Dabir)</div>
            <div id="dabir-messages"><div id="dabir-block-msg">You have to make a Google account to chat</div></div>
            <div id="dabir-input-area" style="display:none;">
                <textarea id="dabir-input" placeholder="Type a message..."></textarea>
                <button id="dabir-send">Send</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        
        // **IMPORTANT: PASTE YOUR ACTUAL GEMINI API KEY HERE**
        // The structure must be: https://...:generateContent?key=YOUR_ACTUAL_KEY_HERE
        const AI_API_ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=AIzaSyDezhfjHHwvrc3jtkzFlhLr7kJj4jbJCzo'; // <-- **PASTE YOUR KEY HERE**
        const API_TYPE = 'GEMINI'; 
        const OPENAI_API_KEY = null; 
        // ---------------------------------------------
        
        const USER_IMAGE_URL = 'https://share.google/images/QjTUfSWcyY9FfTQjx';
        const STORAGE_KEY = 'dabir_last_visit_ts_v3';
        const TWO_HOURS_MS = 2 * 60 * 60 * 1000;

        // ----------------- VARIABLES -----------------
        const loginBtn = document.getElementById('dabir-google');
        const newChatBtn = document.getElementById('dabir-newchat');
        const vibesBtn = document.getElementById('dabir-vibes');
        const createBtn = document.getElementById('dabir-create');
        const messages = document.getElementById('dabir-messages');
        const input = document.getElementById('dabir-input');
        const sendBtn = document.getElementById('dabir-send');
        const inputArea = document.getElementById('dabir-input-area');
        const blockMsg = document.getElementById('dabir-block-msg');
        let username = null;
        let isSending = false;

        // ----------------- CHAT FUNCTIONS -----------------
        function appendMessage(content, who){
            const div = document.createElement('div'); div.className = 'bubble ' + who; div.innerText = content;
            messages.appendChild(div); messages.scrollTop = messages.scrollHeight;
        }
        function showChatAfterLogin(){ 
            blockMsg.style.display = 'none'; 
            inputArea.style.display = 'flex'; 
            appendMessage(`Hello! I’m DabirAI. I'm connected to the ${API_TYPE} service. How can I help you today?`,'ai'); 
        }

        // Connects to the external AI model via standard Fetch API
        async function getAIReply(text){
            const loadingIndicator = document.getElementById('dabir-loading-indicator');

            let payload = {};
            let headers = { "Content-Type": "application/json" };
            let url = AI_API_ENDPOINT;

            if (API_TYPE === 'GEMINI') {
                payload = {
                    contents: [{ role: "user", parts: [{ text: text }] }],
                    config: { user: username }
                };
            } else if (API_TYPE === 'OPENAI') {
                headers["Authorization"] = `Bearer ${OPENAI_API_KEY}`;
                payload = {
                    model: "gpt-3.5-turbo", 
                    messages: [{ role: "user", content: text }],
                    user: username
                };
            }

            try {
                // This will succeed because it's running on https:// (GitHub Pages)
                const response = await fetch(url, {
                    method: "POST",
                    headers: headers,
                    body: JSON.stringify(payload)
                });

                const jsonResponse = await response.json();
                let replyText = 'Error: Failed to extract response from API.';
                
                if (API_TYPE === 'GEMINI' && jsonResponse.candidates && jsonResponse.candidates[0]) {
                     replyText = jsonResponse.candidates[0].content.parts[0].text.trim();
                } else if (API_TYPE === 'OPENAI' && jsonResponse.choices && jsonResponse.choices[0]) {
                     replyText = jsonResponse.choices[0].message.content.trim();
                } else if (jsonResponse.error) {
                    // This handles API key issues (if you forgot to change the placeholder key)
                    replyText = `API Error: ${jsonResponse.error.message}`;
                } else {
                    replyText = `Unknown API Response: ${JSON.stringify(jsonResponse)}`;
                }

                if (loadingIndicator) messages.removeChild(loadingIndicator);
                appendMessage(replyText, 'ai');
                isSending = false;
                sendBtn.disabled = false;

            } catch (e) {
                // This catches network errors
                const errorMsg = `[Network Error] Failed to reach API service. Check your internet connection or the API endpoint structure.`;
                if (loadingIndicator) loadingIndicator.innerText = errorMsg; else appendMessage(errorMsg, 'ai');
                isSending = false;
                sendBtn.disabled = false;
            }
        }

        function sendMessage(){
            if(!username) return alert("You have to login with Google first");
            if(isSending) return; 

            const text = input.value.trim();
            if(!text) return;

            isSending = true;
            sendBtn.disabled = true; 
            appendMessage(text,'user');
            input.value = '';

            // Temporary loading indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'bubble ai';
            loadingDiv.id = 'dabir-loading-indicator';
            loadingDiv.innerText = 'DabirAI is thinking...';
            messages.appendChild(loadingDiv);
            messages.scrollTop = messages.scrollHeight;

            getAIReply(text);
        }

        // ----------------- CHAT EVENTS -----------------
        loginBtn.addEventListener('click', ()=>{
            const email = prompt("Enter your Google account email:");
            if(email){ 
                const name = prompt("Enter your display name:"); 
                username = name || email; 
                loginBtn.innerText = username; 
                showChatAfterLogin(); 
            }
        });
        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keydown', e=>{ if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } });
        newChatBtn.addEventListener('click', ()=>{ 
            if(!username) return alert("You have to login first"); 
            messages.innerHTML = ''; 
            appendMessage("New chat started! Ask me anything.",'ai'); 
        });
        vibesBtn.addEventListener('click', ()=>{
            if(!username) return alert("You have to login first");
            const img = document.createElement('div'); 
            img.style.width = '200px'; 
            img.style.height = '120px'; 
            img.style.borderRadius = '15px';
            img.style.background = 'linear-gradient(45deg,#ff0000,#000000,#ff0000)'; 
            img.style.animation = 'vibeBG 4s linear infinite'; 
            img.style.alignSelf = 'flex-start';
            messages.appendChild(img); 
            messages.scrollTop = messages.scrollHeight;
        });
        createBtn.addEventListener('click', ()=>{ 
            if(!username) return alert("You have to login first"); 
            appendMessage("Create feature coming soon!",'ai'); 
        });

        // ----------------- DabirOS FUNCTIONS -----------------
        const MODAL_CLASS = 'dabir-modal';
        const BACKDROP_CLASS = 'dabir-backdrop';

        function nowTs(){ return Date.now(); }
        function setLastVisit(ts){ try{ localStorage.setItem(STORAGE_KEY,String(ts)); }catch(e){} }
        function getLastVisit(){ try{ const v = localStorage.getItem(STORAGE_KEY); return v?parseInt(v,10):null; }catch(e){return null;} }
        function createBackdrop(){ const d = document.createElement('div'); d.className = BACKDROP_CLASS; d.tabIndex = -1; return d; }

        function showPromptModal(){
            const backdrop = createBackdrop();
            const box = document.createElement('div'); box.className = MODAL_CLASS;
            box.innerHTML=`<div style="font-weight:700;margin-bottom:10px;">Do you want DabirOS (not safe version) :D</div>
            <div style="font-size:13px;margin-bottom:12px;">Detected inactivity >=2 hours. Open the DabirOS form?</div>
            <div class="${MODAL_CLASS}-actions">
                <button class="dabir-no">No, thanks</button>
                <button class="dabir-yes">Yes, show it</button>
            </div>`;
            document.body.appendChild(backdrop);
            backdrop.appendChild(box); 
            
            box.querySelector('.dabir-no').addEventListener('click', ()=>{ document.body.removeChild(backdrop); setLastVisit(nowTs()); });
            box.querySelector('.dabir-yes').addEventListener('click', ()=>{ document.body.removeChild(backdrop); setLastVisit(nowTs()); showFormOverlay(); });
        }

        function showFormOverlay(){
            const backdrop = createBackdrop(); backdrop.style.alignItems = 'flex-start'; backdrop.style.paddingTop = '30px';
            const formBox = document.createElement('div'); formBox.className = 'dabir-form';
            formBox.innerHTML=`
                <h2>DabirOS — Not Safe Version</h2>
                <p>Enter your name below. The page will display the requested image.</p>
                <div style="display:flex; gap:8px; margin-bottom:12px;">
                    <input type="text" id="dabir-name-input" placeholder="Enter your name..." style="flex:1; padding:8px; border-radius:8px; border:none; background:#220000; color:#fff;"/>
                    <button class="dabir-submit dabir-yes" id="dabir-submit-name">Enter</button>
                    <button class="dabir-no" id="dabir-close-form">Close</button>
                </div>
                <img class="dabir-image" id="dabir-user-image" src="${USER_IMAGE_URL}" alt="Requested Image"/>
                <div class="dabir-note" id="dabir-discord-note" style="display:none;">Show This Picture To Dabir On Discord (Discord Username: dab_ir) So You Can Get DabirOS not safe version</div>`;
            
            document.body.appendChild(backdrop);
            backdrop.appendChild(formBox); 

            formBox.querySelector('#dabir-close-form').addEventListener('click', ()=>{ try{ document.body.removeChild(backdrop);}catch(e){} });
            const submitBtn = formBox.querySelector('#dabir-submit-name');
            const nameInput = formBox.querySelector('#dabir-name-input');
            const discordNote = formBox.querySelector('#dabir-discord-note');
            const imageEl = formBox.querySelector('#dabir-user-image');

            submitBtn.addEventListener('click', ()=>{
                const name = String(nameInput.value || '').trim();
                if(!name){ nameInput.focus(); return; }
                discordNote.style.display = 'block';
                const src = imageEl.src.split('?')[0] + '?t=' + Date.now(); 
                imageEl.src = src;
            });

            imageEl.addEventListener('error',()=>{
                if(!imageEl.dataset._errorHandled){ imageEl.dataset._errorHandled = '1';
                    const fallback = document.createElement('div'); fallback.className = 'dabir-image';
                    fallback.style.display = 'flex'; fallback.style.alignItems = 'center'; fallback.style.justifyContent = 'center';
                    fallback.style.padding = '18px'; fallback.style.fontSize = '13px'; fallback.style.color = '#ffdede';
                    fallback.textContent = `Image failed to load from: ${USER_IMAGE_URL}`;
                    try{ imageEl.replaceWith(fallback);}catch(e){}
                }
            });
        }

        // ----------------- MAIN EXECUTION -----------------
        (function main(){
            const last = getLastVisit(); 
            const now = nowTs();
            if(!last){ setLastVisit(now); return; }
            const delta = now - last; 
            if(delta >= TWO_HOURS_MS){ setTimeout(showPromptModal,700); }
            else{ setLastVisit(now); }
        })();

    </script>
</body>
</html>
